# Sitio estático de la web AFRISAN (Blazor WebAssembly). El TLS lo termina el hosting.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # La publicación de Blazor genera copias .gz de cada archivo.
    gzip_static on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Rutas de la aplicación (/ordenes, /costos…): las resuelve Blazor desde index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos que deben revisarse en cada visita para que la web y el modo sin conexión se actualicen.
    location ~ ^/(index\.html|service-worker\.js|service-worker-assets\.js|appsettings\.json)$ {
        expires -1;
    }
}
